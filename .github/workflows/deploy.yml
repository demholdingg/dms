name: CI and deployment

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approval-portal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          SESSION_SECRET: build-only-placeholder-build-only-placeholder
          PAPERLESS_SERVICE_TOKEN: build-only-placeholder

  deploy-development:
    name: Deploy development
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: [self-hosted, linux]
    environment:
      name: development
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          docker compose --project-name approval-portal-development config --quiet
          docker compose --project-name approval-portal-development up -d --build --wait --wait-timeout 120 --remove-orphans
        env:
          IMAGE_TAG: ${{ github.sha }}
          PORTAL_PORT: ${{ vars.PORTAL_PORT }}
          PAPERLESS_NETWORK: ${{ paperless_default }}
          PAPERLESS_URL: "${PAPERLESS_URL:-http://192.168.10.109:8010}"
          PAPERLESS_PUBLIC_URL: "${PAPERLESS_PUBLIC_URL:-http://192.168.10.109:8010}"
          PAPERLESS_SERVICE_TOKEN: "${PAPERLESS_SERVICE_TOKEN:-c4e854dd2ddcb5a5c28fec8720688188f54718d6}"
          PAPERLESS_HOST_HEADER: "${PAPERLESS_HOST_HEADER:-}"
          PAPERLESS_WEBHOOK_SECRET: "${PAPERLESS_WEBHOOK_SECRET:-}"
          SESSION_SECRET: "${SESSION_SECRET:-fh5M3xaNf/WSChJCn8qWsUlZ+e7Mr86Ypc2Hlo02F+rj576V8EanaTiK69c6sQ7I}"
          SESSION_HOURS: "${SESSION_HOURS:-8}"
          COOKIE_SECURE: "${COOKIE_SECURE:-false}"
          APP_URL: "${APP_URL:-http://192.168.10.109:3000}"
          DISPLAY_TZ: "${DISPLAY_TZ:-Asia/Jakarta}"
          SEARCH_MIN_CHARS: "${SEARCH_MIN_CHARS:-3}"
          MAX_GRANT_ATTEMPTS: "${MAX_GRANT_ATTEMPTS:-10}"
          AUDIT_URL: "${AUDIT_URL:-http://audit:8080}"
          AUDIT_API_KEY: "${AUDIT_API_KEY:-}"
          AUDIT_VIEWERS: "${AUDIT_VIEWERS:-}"
          NOTIFY_WEBHOOK_URL: "${NOTIFY_WEBHOOK_URL:-}"
          SMTP_HOST: "${SMTP_HOST:-mail.dutaenergi.co.id}"
          SMTP_PORT: "${SMTP_PORT:-993}"
          SMTP_USER: "${SMTP_USER:-it@dutaenergi.co.id}"
          SMTP_PASS: "${SMTP_PASS:-September93##}"
          SMTP_FROM: "${SMTP_FROM:-mail.dutaenergi.co.id}"

  deploy-production:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: [self-hosted, linux]
    environment:
      name: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          docker compose --project-name approval-portal-production config --quiet
          docker compose --project-name approval-portal-production up -d --build --wait --wait-timeout 120 --remove-orphans
        env:
          IMAGE_TAG: ${{ github.sha }}
          PORTAL_PORT: ${{ vars.PORTAL_PORT }}
          PAPERLESS_NETWORK: ${{ paperless_default }}
          PAPERLESS_URL: "${PAPERLESS_URL:-http://192.168.10.109:8010}"
          PAPERLESS_PUBLIC_URL: "${PAPERLESS_PUBLIC_URL:-http://192.168.10.109:8010}"
          PAPERLESS_SERVICE_TOKEN: "${PAPERLESS_SERVICE_TOKEN:-c4e854dd2ddcb5a5c28fec8720688188f54718d6}"
          PAPERLESS_HOST_HEADER: "${PAPERLESS_HOST_HEADER:-}"
          PAPERLESS_WEBHOOK_SECRET: "${PAPERLESS_WEBHOOK_SECRET:-}"
          SESSION_SECRET: "${SESSION_SECRET:-fh5M3xaNf/WSChJCn8qWsUlZ+e7Mr86Ypc2Hlo02F+rj576V8EanaTiK69c6sQ7I}"
          SESSION_HOURS: "${SESSION_HOURS:-8}"
          COOKIE_SECURE: "${COOKIE_SECURE:-false}"
          APP_URL: "${APP_URL:-http://192.168.10.109:3000}"
          DISPLAY_TZ: "${DISPLAY_TZ:-Asia/Jakarta}"
          SEARCH_MIN_CHARS: "${SEARCH_MIN_CHARS:-3}"
          MAX_GRANT_ATTEMPTS: "${MAX_GRANT_ATTEMPTS:-10}"
          AUDIT_URL: "${AUDIT_URL:-http://audit:8080}"
          AUDIT_API_KEY: "${AUDIT_API_KEY:-}"
          AUDIT_VIEWERS: "${AUDIT_VIEWERS:-}"
          NOTIFY_WEBHOOK_URL: "${NOTIFY_WEBHOOK_URL:-}"
          SMTP_HOST: "${SMTP_HOST:-mail.dutaenergi.co.id}"
          SMTP_PORT: "${SMTP_PORT:-993}"
          SMTP_USER: "${SMTP_USER:-it@dutaenergi.co.id}"
          SMTP_PASS: "${SMTP_PASS:-September93##}"
          SMTP_FROM: "${SMTP_FROM:-mail.dutaenergi.co.id}"
