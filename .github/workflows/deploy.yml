name: Build and Deploy Container

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: self-hosted # atau ubuntu-latest jika ingin build di cloud GitHub
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Build image dan push ke Docker Hub / Registry
      - name: Build and Push Docker Image
        run: |
          docker build -t administrator/approval-portal:latest .
          # docker push administrator/approval-portal:latest (jika menggunakan registry publik)

      # 2. Perintah ke server untuk memperbarui container dengan image baru
      - name: Update Container on Server
        run: |
          cd /home/administrator/docker/dmsportal
          docker compose pull
          docker compose up -d --force-recreate
