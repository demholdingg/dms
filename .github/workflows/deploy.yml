name: Deploy Portal Approval to Production

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Restart Docker Compose
        run: |
          # 1. Pindah ke folder project asli di server Anda tempat file .env berada
          # (Ganti path di bawah dengan direktori asli project Anda di server)
          /home/administrator/docker/dmsportal

          echo "Memeriksa keberadaan file .env..."
          if [ ! -f .env ]; then
            echo "Error: File .env tidak ditemukan di direktori ini!"
            exit 1
          fi

          echo "Menjalankan proses build dan restart container portal approval..."
          docker compose down
          docker compose up -d --build
          echo "Deployment berhasil diselesaikan!"
