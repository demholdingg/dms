name: Deploy Portal Approval to Production

on:
  push:
    branches: ["develop"] # Ganti dengan "master" jika branch utama Anda master

jobs:
  deploy:
    runs-on: self-hosted # Menggunakan runner di server Linux produksi Anda
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Environment File (.env)
        run: |
          # Memastikan file .env sudah ada di server sebelum compose dijalankan
          if [ ! -f .env ]; then
            echo "Error: File .env tidak ditemukan di direktori server!"
            echo "Silakan buat file .env berdasarkan .env.example terlebih dahulu."
            exit 1
          fi

      - name: Build and Restart Docker Compose
        run: |
          echo "Menjalankan proses build dan restart container portal approval..."

          # Turunkan kontainer lama, build image baru, dan jalankan di background
          docker compose down
          docker compose up -d --build

          echo "Deployment berhasil diselesaikan!"


          services:
  portal:
    build: .
    image: "${IMAGE_NAME:-approval-portal}:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    environment:
      PAPERLESS_URL: ${PAPERLESS_URL:-http://webserver:8000}
      PAPERLESS_PUBLIC_URL: ${PAPERLESS_PUBLIC_URL:-http://localhost:8000}
      PAPERLESS_SERVICE_TOKEN: ${PAPERLESS_SERVICE_TOKEN:?isi PAPERLESS_SERVICE_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET:?isi SESSION_SECRET (min 32 karakter)}
      PAPERLESS_HOST_HEADER: ${PAPERLESS_HOST_HEADER:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DISPLAY_TZ: ${DISPLAY_TZ:-Asia/Jakarta}
      SEARCH_MIN_CHARS: ${SEARCH_MIN_CHARS:-3}
      MAX_GRANT_ATTEMPTS: ${MAX_GRANT_ATTEMPTS:-10}
      AUDIT_URL: ${AUDIT_URL:-http://audit:8080}
      AUDIT_API_KEY: ${AUDIT_API_KEY:-}
      AUDIT_VIEWERS: ${AUDIT_VIEWERS:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-approval@localhost}
    volumes:
      - portal_data:/data
    networks: [paperless]

volumes:
  portal_data:

networks:
  paperless:
    external: true
    name: ${PAPERLESS_NETWORK:?isi PAPERLESS_NETWORK}
