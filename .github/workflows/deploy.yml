name: CI and deployment

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approval-portal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          SESSION_SECRET: build-only-placeholder-build-only-placeholder
          PAPERLESS_SERVICE_TOKEN: build-only-placeholder

  deploy-development:
    name: Deploy development
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: [self-hosted, linux, development]
    environment:
      name: development
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          docker compose --project-name approval-portal-development config --quiet
          docker compose --project-name approval-portal-development up -d --build --wait --wait-timeout 120 --remove-orphans
        env:
          IMAGE_TAG: ${{ github.sha }}
          PORTAL_PORT: ${{ vars.PORTAL_PORT }}
          PAPERLESS_NETWORK: ${{ vars.PAPERLESS_NETWORK }}
          PAPERLESS_URL: ${{ vars.PAPERLESS_URL }}
          PAPERLESS_PUBLIC_URL: ${{ vars.PAPERLESS_PUBLIC_URL }}
          PAPERLESS_HOST_HEADER: ${{ vars.PAPERLESS_HOST_HEADER }}
          PAPERLESS_SERVICE_TOKEN: ${{ secrets.PAPERLESS_SERVICE_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
          SESSION_HOURS: ${{ vars.SESSION_HOURS }}
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
          DISPLAY_TZ: ${{ vars.DISPLAY_TZ }}
          SEARCH_MIN_CHARS: ${{ vars.SEARCH_MIN_CHARS }}
          MAX_GRANT_ATTEMPTS: ${{ vars.MAX_GRANT_ATTEMPTS }}
          AUDIT_URL: ${{ vars.AUDIT_URL }}
          AUDIT_API_KEY: ${{ secrets.AUDIT_API_KEY }}
          AUDIT_VIEWERS: ${{ vars.AUDIT_VIEWERS }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}

  deploy-production:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: [self-hosted, linux, production]
    environment:
      name: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          docker compose --project-name approval-portal-production config --quiet
          docker compose --project-name approval-portal-production up -d --build --wait --wait-timeout 120 --remove-orphans
        env:
          IMAGE_TAG: ${{ github.sha }}
          PORTAL_PORT: ${{ vars.PORTAL_PORT }}
          PAPERLESS_NETWORK: ${{ vars.PAPERLESS_NETWORK }}
          PAPERLESS_URL: ${{ vars.PAPERLESS_URL }}
          PAPERLESS_PUBLIC_URL: ${{ vars.PAPERLESS_PUBLIC_URL }}
          PAPERLESS_HOST_HEADER: ${{ vars.PAPERLESS_HOST_HEADER }}
          PAPERLESS_SERVICE_TOKEN: ${{ secrets.PAPERLESS_SERVICE_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
          SESSION_HOURS: ${{ vars.SESSION_HOURS }}
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
          DISPLAY_TZ: ${{ vars.DISPLAY_TZ }}
          SEARCH_MIN_CHARS: ${{ vars.SEARCH_MIN_CHARS }}
          MAX_GRANT_ATTEMPTS: ${{ vars.MAX_GRANT_ATTEMPTS }}
          AUDIT_URL: ${{ vars.AUDIT_URL }}
          AUDIT_API_KEY: ${{ secrets.AUDIT_API_KEY }}
          AUDIT_VIEWERS: ${{ vars.AUDIT_VIEWERS }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
